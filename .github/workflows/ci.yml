name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-desktop-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-desktop-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Fetch Dependencies
        run: nix develop .#desktop -c make deps

      - name: Lint
        run: nix develop .#desktop -c make lint

      - name: Test
        run: nix develop .#desktop -c make test

  build-linux:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-desktop-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-desktop-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 5G
          purge: true
          purge-prefixes: nix-desktop-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Fetch Dependencies
        run: nix develop .#desktop -c make deps

      - name: Build Linux Desktop
        run: nix develop .#desktop -c make build-linux-app

      - name: Upload Linux App
        uses: actions/upload-artifact@v7
        with:
          name: linux-app-${{ matrix.os }}
          path: frontend/build/linux/*/release/bundle/

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Nix cache
        uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-android-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock') }}
          restore-prefixes-first-match: nix-android-${{ runner.os }}-${{ runner.arch }}-
          gc-max-store-size-linux: 12G
          purge: true
          purge-prefixes: nix-android-${{ runner.os }}-${{ runner.arch }}-
          purge-created: 0
          purge-primary-key: never

      - name: Fetch Dependencies
        run: nix develop -c make deps-android

      - name: Setup Android Keystore
        # The secrets context is not available in step-level `if`, so the
        # presence check goes through an env var instead
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > frontend/android/app/release.jks
          cat <<EOF > frontend/android/key.properties
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build Android APK
        run: nix develop -c make build-android-apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    strategy:
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # macOS builds use the official toolchains instead of Nix: nixpkgs
      # Flutter lives in the read-only /nix/store, and `flutter build macos`
      # copies FlutterMacOS.framework from there preserving permissions, so
      # the subsequent in-place `lipo` thinning fails with "Permission
      # denied". Xcode comes from the runner image either way.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch Dependencies
        run: make deps

      - name: Build macOS Desktop
        run: make build-macos-app

      - name: Import Code Signing Certificate
        # The secrets context is not available in step-level `if`, so the
        # presence check goes through an env var instead
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm cert.p12

      - name: Sign macOS App
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
        run: |
          APP_PATH="$(ls -d frontend/build/macos/Build/Products/Release/*.app | head -1)"
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep -o '"Developer ID Application[^"]*"' | head -1 | tr -d '"')"
          echo "Signing with: $IDENTITY"
          # Notarization requires every nested Mach-O to carry a Developer ID
          # signature with hardened runtime; `flutter build` only signs ad-hoc
          find "$APP_PATH/Contents/Frameworks" -depth \
            \( -name "*.framework" -o -name "*.dylib" \) -print0 \
            | while IFS= read -r -d '' item; do
              codesign --force --options runtime --timestamp --sign "$IDENTITY" "$item"
            done
          codesign --force --options runtime --timestamp \
            --entitlements frontend/macos/Runner/Release.entitlements \
            --sign "$IDENTITY" "$APP_PATH"
          codesign --verify --strict --deep "$APP_PATH"

      - name: Notarize macOS App
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_ID != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PATH="$(ls -d frontend/build/macos/Build/Products/Release/*.app | head -1)"
          ditto -c -k --keepParent "$APP_PATH" notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"
          rm notarize.zip

      - name: Package macOS App
        # upload-artifact strips symlinks and executable bits, which corrupts
        # .app bundles — zip with ditto first to preserve them
        run: |
          APP_PATH="$(ls -d frontend/build/macos/Build/Products/Release/*.app | head -1)"
          ditto -c -k --keepParent "$APP_PATH" macos-app.zip

      - name: Upload macOS App
        uses: actions/upload-artifact@v7
        with:
          name: macos-app-${{ matrix.os }}
          path: macos-app.zip

  build-windows:
    strategy:
      matrix:
        # `flutter build windows` always targets the host architecture, so
        # each arch needs its own runner. windows-11-arm is free for public
        # repos; in private repos it bills standard Actions minutes
        # (2x Windows multiplier)
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Windows builds use the official toolchains (like macOS) and inline
      # the make recipes: GNU make is not available in Git Bash on the
      # runners, and the windows-11-arm partner image has no chocolatey
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Setup Flutter
        if: matrix.arch == 'x64'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The downloadable Flutter SDK for Windows is x64-only; under x64
      # emulation `flutter build windows` silently produces an x64 app in
      # build/windows/x64. Installing from git instead makes the bootstrap
      # fetch a native arm64 Dart SDK, so the tool targets arm64 natively
      - name: Setup Flutter (arm64, from git)
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          cygpath -w "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      # cgo needs a GCC-compatible toolchain; the arm64 runner only ships
      # MSVC-flavored LLVM, so fetch llvm-mingw (x64 has MinGW preinstalled)
      - name: Install llvm-mingw
        if: matrix.arch == 'arm64'
        shell: bash
        env:
          LLVM_MINGW_TAG: "20260616"
        run: |
          curl -fsSL -o llvm-mingw.zip \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_TAG}/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-aarch64.zip"
          unzip -q llvm-mingw.zip -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-${LLVM_MINGW_TAG}-ucrt-aarch64/bin" >> "$GITHUB_PATH"

      - name: Fetch Dependencies
        shell: bash
        run: |
          cd backend && go mod tidy
          cd ../frontend && flutter pub get

      - name: Build Go Shared Library
        shell: bash
        env:
          CGO_ENABLED: "1"
          CC: ${{ matrix.arch == 'arm64' && 'aarch64-w64-mingw32-clang' || 'gcc' }}
        run: |
          cd backend
          go build -buildmode=c-shared -o ../frontend/windows/libbackend.dll ./cmd/shared/main.go

      - name: Build Windows Desktop
        shell: bash
        run: cd frontend && flutter build windows

      - name: Upload Windows App
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-${{ matrix.arch }}
          path: frontend/build/windows/${{ matrix.arch }}/runner/Release/

  sign-windows:
    # Azure Artifact Signing (formerly Trusted Signing); all steps are
    # skipped when AZURE_SIGNING_ENDPOINT is not set. Runs as a separate x64
    # job because azure/artifact-signing-action does not support arm
    # runners (signing arm64 binaries from an x64 host works fine)
    needs: build-windows
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-latest
    steps:
      - name: Download Windows App
        # The secrets context is not available in step-level `if`, so the
        # presence check goes through an env var instead
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
        uses: actions/download-artifact@v6
        with:
          name: windows-app-${{ matrix.arch }}
          path: app

      - name: Sign Windows Binaries
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\app
          files-folder-filter: exe,dll
          file-digest: SHA256
          # Timestamping is mandatory: Artifact Signing certs live ~3 days
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Signed Windows App
        # Artifacts are immutable, so the signed bundle needs a new name
        if: ${{ env.HAS_SECRET == 'true' }}
        env:
          HAS_SECRET: ${{ secrets.AZURE_SIGNING_ENDPOINT != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-app-${{ matrix.arch }}-signed
          path: app
