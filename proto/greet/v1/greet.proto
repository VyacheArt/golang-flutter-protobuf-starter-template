syntax = "proto3";

package greet.v1;

option go_package = "template/backend/gen/greet/v1;greetv1";

message GreetRequest {
  string name = 1;
}

message GreetResponse {
  string greeting = 2;
}

service GreetService {
  rpc Greet(GreetRequest) returns (GreetResponse) {}
  // Full-duplex bidirectional streaming: every request is answered
  // immediately on the same stream. Requires an HTTP/2 transport.
  rpc GreetStream(stream GreetRequest) returns (stream GreetResponse) {}
}
